name: Project ET autonomous demo observer (no orders)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-et-observer
  cancel-in-progress: false
jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify demo-only guardrails and connectivity without placing orders
        shell: bash
        run: |
          python tools/check_etoro_account_read_access.py
