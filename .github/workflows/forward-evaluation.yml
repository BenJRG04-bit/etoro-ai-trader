name: Project ET forward snapshot evaluation
on:
  schedule:
    - cron: '15 1 * * 2-6'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Locate prior immutable snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GH_REPO"]
          headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                   "Accept": "application/vnd.github+json",
                   "X-GitHub-Api-Version": "2022-11-28"}
          url=f"https://api.github.com/repos/{repo}/actions/workflows/forward-signals.yml/runs?branch=main&status=success&per_page=30"
          try:
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  runs=json.load(response).get("workflow_runs", [])
              # Skip latest snapshot: only an earlier run is eligible.
              # GitHub run ordering is descending, so selecting the second
              # eligible successful run prevents evaluating a same-run artifact.
              if len(runs) < 2:
                  print("PENDING: need two successful forward snapshot runs")
              else:
                  selected=runs[1]
                  with open("prior_run_id.txt", "w") as f:
                      f.write(str(selected["id"]))
                  print("Prior run:", selected["id"])
          except (OSError, ValueError, KeyError) as exc:
              print("PENDING: unable to locate earlier snapshot:", type(exc).__name__)
          PY
      - name: Download previous run's snapshot
        if: ${{ hashFiles('prior_run_id.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$(cat prior_run_id.txt)" -n project-et-forward-signals -D prior_snapshot
      - name: Evaluate against current public closes
        if: ${{ hashFiles('prior_snapshot/forward_signal_snapshot.json') != '' }}
        run: python run_forward_evaluation.py prior_snapshot/forward_signal_snapshot.json > forward_evaluation_report.json
      - name: Report result
        run: |
          python - <<'PY'
          import json, os
          path="forward_evaluation_report.json"
          if not os.path.exists(path):
              result={"status":"PENDING", "reason":"No older archived snapshot yet",
                      "research_only":True,"orders_allowed":False,"live_trading_approved":False}
              with open(path,"w") as f: json.dump(result,f,indent=2)
          else:
              result=json.load(open(path))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: project-et-forward-evaluation
          path: forward_evaluation_report.json
          retention-days: 90
