name: Project ET portfolio benchmark research
on:
  push:
    paths:
      - 'portfolio_benchmark.py'
      - 'portfolio_performance_scorecard.py'
      - 'portfolio_stress_scenarios.py'
      - 'portfolio_stress_resilience.py'
      - 'tests/test_portfolio_stress_resilience.py'
      - 'tests/test_portfolio_stress_scenarios.py'
      - 'tests/test_portfolio_performance_scorecard.py'
      - 'run_portfolio_benchmark.py'
      - 'tests/test_portfolio_benchmark.py'
      - '.github/workflows/portfolio-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch public data and compare shared-account policies
        run: python run_portfolio_benchmark.py > portfolio_benchmark_report.json
      - name: Print research summary
        run: |
          python - <<'PY'
          import json
          report=json.load(open("portfolio_benchmark_report.json"))
          if report["status"] != "EXPLORATORY_ONLY":
              print("Unavailable: " + report["error_type"])
          else:
              for fee, row in report["comparison"]["scenarios"].items():
                  print(f"fee={fee}: council £{row['council_guarded']['end_equity']:.2f}, capped hold £{row['equal_weight_capped_hold']['end_equity']:.2f}, difference £{row['council_minus_hold']:.2f}")
          PY
      - name: Build historical performance scorecard
        run: python portfolio_performance_scorecard.py
      - name: Build synthetic shock stress report when public prices are available
        run: |
          python - <<'PY'
          import json
          from historical_prices import WATCHLIST, fetch_daily_closes
          from portfolio_stress_scenarios import stress_audit
          from pathlib import Path
          try:
              histories = [fetch_daily_closes(t, period='2y') for t in WATCHLIST]
              dates = histories[0]['dates']
              if any(row['dates'] != dates for row in histories):
                  raise ValueError('DateMisalignment')
              result = stress_audit({row['ticker']: row['closes'] for row in histories})
          except (ValueError, TypeError, KeyError, IndexError, OSError) as exc:
              result = {'status': 'UNAVAILABLE', 'error_type': type(exc).__name__, 'research_only': True, 'orders_allowed': False, 'live_trading_approved': False}
          Path('portfolio_stress_report.json').write_text(json.dumps(result, indent=2))
          print(result['status'])
          PY
      - name: Cross-check synthetic stress resilience and exposure limits
        run: python portfolio_stress_resilience.py
      - name: Archive offline report
        uses: actions/upload-artifact@v4
        with:
          name: project-et-portfolio-benchmark
          path: |
            portfolio_benchmark_report.json
            portfolio_performance_scorecard.json
            portfolio_stress_report.json
            portfolio_stress_resilience.json
          retention-days: 30
