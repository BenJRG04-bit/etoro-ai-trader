name: Project ET unified research command centre
on:
  schedule:
    - cron: '55 8 * * 2-6'
  workflow_dispatch:
  push:
    paths:
      - 'research_command_centre.py'
      - 'tests/test_research_command_centre.py'
      - '.github/workflows/research-command-centre.yml'
permissions:
  contents: read
  actions: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Generate latest central intelligence research
        run: python run_central_research_cycle.py
      - name: Generate latest small-budget study
        run: python small_budget_study.py
      - name: Generate illustrative execution-cost scenarios
        run: python execution_cost_study.py
      - name: Generate historical cost-adjusted portfolio comparisons
        run: python cost_adjusted_portfolio_study.py
      - name: Audit council against capped baseline after costs
        run: python decision_quality_audit.py
      - name: Run rolling historical decision audit
        run: python run_rolling_decision_audit.py
      - name: Build offline research dashboard
        run: python research_command_centre.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-et-command-centre
          path: |
            project_et_command_centre.html
            central_research_cycle.json
            small_budget_study.json
            execution_cost_study.json
            cost_adjusted_portfolio_study.json
            decision_quality_audit.json
            rolling_decision_audit.json
          retention-days: 30
