name: Project ET Market Event Safety Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/market_event_engine.py'
      - 'tests/test_market_event_engine.py'
      - '.github/workflows/market-event-safety.yml'
  pull_request:
    paths:
      - 'tools/market_event_engine.py'
      - 'tests/test_market_event_engine.py'
      - '.github/workflows/market-event-safety.yml'
permissions:
  contents: read
jobs:
  market-event-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test research-only event engine
        run: python -m unittest discover -s tests -p 'test_market_event_engine.py' -v
