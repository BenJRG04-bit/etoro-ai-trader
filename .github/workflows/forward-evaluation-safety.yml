name: Project ET Forward Evaluation Safety Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/check_forward_evaluation.py'
      - 'tests/test_forward_evaluation_checker.py'
      - '.github/workflows/forward-evaluation-safety.yml'
  pull_request:
    paths:
      - 'tools/check_forward_evaluation.py'
      - 'tests/test_forward_evaluation_checker.py'
      - '.github/workflows/forward-evaluation-safety.yml'
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated research-only tests
        run: python -m unittest discover -s tests -p 'test_forward_evaluation_checker.py' -v
