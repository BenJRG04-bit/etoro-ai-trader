name: Scheduled read-only market research
on:
  schedule:
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests first
        run: python -m unittest discover -s tests -v
      - name: Fetch public historical prices and produce research report
        if: always()
        run: python market_research.py
      - name: Generate audited historical strategy report
        if: always()
        run: python generate_historical_report.py
      - name: Save report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-et-research-report
          path: |
            research_report.json
            historical_research_report.json
          if-no-files-found: error
          retention-days: 30
