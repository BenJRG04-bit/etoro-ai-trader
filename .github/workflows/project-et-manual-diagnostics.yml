name: Project ET manual diagnostics
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Offline code and test diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ETORO_TRADING_ENABLED: "false"
      LIVE_TRADING_ENABLED: "false"
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Diagnose duplicate test module names
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          names = defaultdict(list)
          for p in Path('.').rglob('test_*.py'):
              if '.git' not in p.parts and '.venv' not in p.parts:
                  names[p.stem].append(str(p))
          for name, paths in sorted(names.items()):
              if len(paths) > 1:
                  print(f'DUPLICATE TEST MODULE: {name}: {paths}')
          print('Test files:', sum(map(len, names.values())))
          PY
      - name: Run offline unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > unit-tests.log 2>&1
          result=$?
          cat unit-tests.log
          echo "Unit test exit code: $result"
          exit "$result"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-et-offline-diagnostics
          path: unit-tests.log
          if-no-files-found: ignore
