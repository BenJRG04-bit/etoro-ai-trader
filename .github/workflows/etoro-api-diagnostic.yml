name: eToro API diagnostic (no trading)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check authentication and instrument search
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: |
          python - <<'PY'
          import os, uuid, urllib.request, urllib.parse, urllib.error, json
          api_key = os.environ.get("ETORO_API_KEY", "")
          user_key = os.environ.get("ETORO_USER_KEY", "")
          if not api_key or not user_key:
              print("MISSING_SECRET: Check ETORO_API_KEY and ETORO_USER_KEY names.")
              raise SystemExit(1)
          url = "https://public-api.etoro.com/api/v1/market-data/search?" + urllib.parse.urlencode({"internalSymbolFull": "AAPL"})
          req = urllib.request.Request(url, headers={
              "x-api-key": api_key,
              "x-user-key": user_key,
              "x-request-id": str(uuid.uuid4()),
              "Accept": "application/json"
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
                  print("HTTP_STATUS:", response.status)
                  matches = [x for x in data.get("items", []) if x.get("internalSymbolFull") == "AAPL"]
                  print("EXACT_MATCH_COUNT:", len(matches))
                  for item in matches:
                      print("INSTRUMENT_ID:", item.get("instrumentId"))
          except urllib.error.HTTPError as error:
              print("HTTP_STATUS:", error.code)
              print("API rejected request. Check permissions, key pairing and environment; no secrets printed.")
              print("ERROR_CATEGORY:", {401:"unauthorized",403:"forbidden",404:"endpoint_not_found",429:"rate_limited"}.get(error.code,"other_http_error"))
              raw_error = error.read(4096)
              try:
                  payload = json.loads(raw_error.decode("utf-8", errors="replace"))
                  if isinstance(payload, dict):
                      for field in ("code", "errorCode", "statusCode"):
                          value = payload.get(field)
                          if isinstance(value, int):
                              print("API_ERROR_" + field.upper() + ":", value)
              except (ValueError, UnicodeError):
                  pass
              # Emit only a tightly allowlisted, short server error code/message.
              try:
                  payload = json.loads(raw_error.decode("utf-8", errors="replace"))
                  if isinstance(payload, dict):
                      for field in ("error", "error_code", "errorCode", "message"):
                          val = payload.get(field)
                          if isinstance(val, str):
                              import re
                              if re.fullmatch(r"[A-Za-z_ -]{1,80}", val):
                                  print("SERVER_" + field.upper() + ":", val)
              except (ValueError, UnicodeError):
                  pass
              raise SystemExit(1)
          except Exception as error:
              print("NETWORK_ERROR_TYPE:", type(error).__name__)
              raise SystemExit(1)
          PY
