name: Project ET historical decision diagnostics
on:
  push:
    paths:
      - 'run_diagnostic_report.py'
      - '.github/workflows/decision-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Analyse historical public market data
        run: python run_diagnostic_report.py > decision_diagnostic_report.json
      - name: Summarize research decisions
        run: |
          python - <<'PY'
          import json
          d = json.load(open("decision_diagnostic_report.json"))
          for ticker, entry in d["assets"].items():
              if entry["status"] != "EXPLORATORY_ONLY":
                  print(f"{ticker}: data unavailable")
                  continue
              r = entry["diagnostics"]
              print(f"{ticker}: positive {r['positive_research_days']}/{r['evaluated_days']} days; risk veto {r['risk_veto_days']} days; nonpositive decision before up day {r['nonpositive_decision_before_up_day']} days")
          PY
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-et-decision-diagnostics
          path: decision_diagnostic_report.json
          if-no-files-found: warn
          retention-days: 30
