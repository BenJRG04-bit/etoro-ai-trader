name: Project ET archived pattern forward evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 2-6'
  push:
    paths:
      - 'run_pattern_forward_evaluation.py'
      - 'run_pattern_forward_snapshot.py'
      - 'pattern_archive_run_selection.py'
      - 'tests/test_pattern_forward_validation.py'
      - '.github/workflows/pattern-forward-evaluation.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: project-et-pattern-forward-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline research and safety modules
        run: python -m unittest discover -s tests -v
      - name: Select an older main-branch GitHub pattern archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from pattern_archive_run_selection import select_prior_pattern_run

          repo = os.environ["GH_REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "pattern-research.yml/runs?branch=main&status=success&per_page=100"
          )
          try:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs = json.load(response).get("workflow_runs", [])
              selected = select_prior_pattern_run(
                  runs, evaluated_at=datetime.now(timezone.utc).isoformat()
              )
              if selected is None:
                  print("PENDING: No sufficiently old successful archived snapshot")
              else:
                  Path("pattern_prior_run_id.txt").write_text(str(selected))
                  print("Selected archived GitHub Actions run:", selected)
          except (OSError, ValueError, TypeError, KeyError) as exc:
              print("PENDING: Archive listing unavailable:", type(exc).__name__)
          PY
      - name: Download prior immutable archived snapshot
        if: ${{ hashFiles('pattern_prior_run_id.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$(cat pattern_prior_run_id.txt)" --name project-et-pattern-research --dir prior_pattern_archive
      - name: Evaluate against strictly later public daily closes
        if: ${{ hashFiles('prior_pattern_archive/pattern_forward_snapshot.json') != '' }}
        run: python run_pattern_forward_evaluation.py prior_pattern_archive/pattern_forward_snapshot.json > pattern_forward_evaluation.json
      - name: Report observed or still-pending outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("pattern_forward_evaluation.json")
          if not path.exists():
              result = {
                  "status": "PENDING", "reason": "NO_ELIGIBLE_ARCHIVED_PATTERN_SNAPSHOT",
                  "research_only": True, "orders_allowed": False,
                  "demo_trading_approved": False, "live_trading_approved": False
              }
              path.write_text(json.dumps(result, indent=2), encoding="utf-8")
          with path.open(encoding="utf-8") as file:
              result = json.load(file)
          assert result["research_only"] is True
          assert result["orders_allowed"] is False
          assert result["demo_trading_approved"] is False
          assert result["live_trading_approved"] is False
          print("Pattern forward status:", result["status"])
          print("Completed asset observations:", result.get("observed_count", 0))
          print("Still awaiting new closes:", result.get("pending_count", 0))
          print("Frozen research candidates:", result.get("research_candidates_observed", 0))
          if result["status"] == "UNAVAILABLE":
              raise SystemExit("Archived prediction or market data failed safety validation")
          PY
      - name: Archive read-only outcome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-et-pattern-forward-evaluation
          path: pattern_forward_evaluation.json
          if-no-files-found: warn
          retention-days: 90
