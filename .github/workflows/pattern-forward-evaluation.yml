name: Project ET archived pattern forward evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 2-6'
  push:
    paths:
      - 'run_pattern_forward_evaluation.py'
      - 'run_pattern_forward_snapshot.py'
      - 'run_pattern_forward_batch.py'
      - 'pattern_archive_run_selection.py'
      - 'tests/test_pattern_forward_validation.py'
      - 'tests/test_pattern_forward_batch.py'
      - '.github/workflows/pattern-forward-evaluation.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: project-et-pattern-forward-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline research and safety modules
        run: python -m unittest discover -s tests -v
      - name: Select ALL mature main-branch snapshots in a rolling batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from pattern_archive_run_selection import select_mature_pattern_runs

          repo = os.environ["GH_REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "pattern-research.yml/runs?branch=main&status=success&per_page=100"
          )
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])
          selected = select_mature_pattern_runs(
              runs, evaluated_at=datetime.now(timezone.utc).isoformat(),
              minimum_age_hours=48, max_runs=30
          )
          if selected:
              Path("pattern_prior_run_ids.txt").write_text(
                  "\n".join(map(str, selected)) + "\n", encoding="utf-8"
              )
          print("Older frozen pattern archives selected:", len(selected))
          print("No outcomes will be invented when later closes are missing")
          PY
      - name: Download each selected precommitted research archive
        if: ${{ hashFiles('pattern_prior_run_ids.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prior_pattern_archives
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            mkdir -p "prior_pattern_archives/$run_id"
            gh run download "$run_id" -R "$GH_REPO" \
              --name project-et-pattern-research \
              --dir "prior_pattern_archives/$run_id"
          done < pattern_prior_run_ids.txt
      - name: Score all archives against one shared fresh public-price download
        if: ${{ hashFiles('pattern_prior_run_ids.txt') != '' }}
        run: |
          python run_pattern_forward_batch.py \
            prior_pattern_archives evaluated_pattern_archives > pattern_batch_summary.json
      - name: Report complete, pending or invalid frozen outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = Path("pattern_batch_summary.json")
          if not summary.exists():
              result = {
                  "status": "PENDING",
                  "reason": "NO_MATURE_PATTERN_ARCHIVES",
                  "research_only": True,
                  "orders_allowed": False,
                  "demo_trading_approved": False,
                  "live_trading_approved": False,
              }
              Path("pattern_forward_evaluation.json").write_text(
                  json.dumps(result, indent=2), encoding="utf-8"
              )
              print("Pattern forward status: PENDING (no aged archives)")
          else:
              with summary.open(encoding="utf-8") as file:
                  result = json.load(file)
              assert result["research_only"] is True
              assert result["orders_allowed"] is False
              assert result["demo_trading_approved"] is False
              assert result["live_trading_approved"] is False
              docs = list(Path("evaluated_pattern_archives").rglob("pattern_forward_evaluation.json"))
              if result["archives"] != len(docs):
                  raise SystemExit("Missing scored archive outputs")
              print("Pattern forward batch status:", result["status"])
              print("Archived predictions evaluated:", result["archives"])
              print("Outcomes observed:", result["observed"])
              print("Still waiting for newer closes:", result["pending"])
              print("Invalid archives or market data:", result["unavailable"])
              if result["status"] != "BATCH_COMPLETE" or result["unavailable"]:
                  raise SystemExit("Unsafe or invalid archive detected; no results can be approved")
          PY
      - name: Archive every read-only outcome with its original run identifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-et-pattern-forward-evaluation
          path: |
            pattern_forward_evaluation.json
            pattern_batch_summary.json
            evaluated_pattern_archives/
          if-no-files-found: warn
          retention-days: 90
