name: eToro Demo read-only connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check eToro Demo API (GET only)
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: python tools/etoro_demo_probe.py
