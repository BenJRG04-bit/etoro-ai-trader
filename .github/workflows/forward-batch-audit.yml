name: Project ET cumulative forward research audit
on:
  schedule:
    - cron: '35 2 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/research-chain-bootstrap.txt'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Download available archived forward snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p archived_snapshots
          python - <<'PY'
          import json, os, urllib.request
          headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                   "Accept": "application/vnd.github+json"}
          url=f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/workflows/forward-signals.yml/runs?branch=main&status=success&per_page=100"
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                  runs=json.load(response).get("workflow_runs", [])
              ids=[str(r["id"]) for r in runs if r.get("conclusion")=="success"]
          except (OSError, ValueError, KeyError) as exc:
              print("Archive discovery unavailable:", type(exc).__name__)
              ids=[]
          with open("archived_run_ids.txt","w") as f: f.write("\n".join(ids[:90]))
          print("Available successful snapshot runs:",len(ids[:90]))
          PY
          while read -r run_id || [ -n "$run_id" ]; do
            [ -n "$run_id" ] || continue
            mkdir -p "archived_snapshots/$run_id"
            gh run download "$run_id" -n project-et-forward-signals -D "archived_snapshots/$run_id" || echo "Missing/expired artifact for run $run_id"
          done < archived_run_ids.txt
      - name: Audit all downloaded snapshots against later closes
        run: python run_forward_batch_audit.py archived_snapshots > forward_batch_audit_report.json
      - name: Verify audit schema before downstream evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("forward_batch_audit_report.json").read_text())
          if r.get("status") != "RESEARCH_AUDIT" or r.get("research_only") is not True or r.get("orders_allowed") is not False or r.get("live_trading_approved") is not False:
              raise SystemExit("Forward audit unavailable or unsafe; downstream evidence generation blocked")
          PY
      - name: Print research coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open("forward_batch_audit_report.json"))
          print("Status:",r["status"])
          for key in ("snapshot_count","observed_snapshots","pending_snapshots","unavailable_snapshots","rejected_snapshots"):
              if key in r: print(key,r[key])
          PY
      - name: Summarize evidence quality and minimum sample counts
        run: python run_forward_evidence_quality.py forward_batch_audit_report.json > forward_evidence_quality_report.json
      - name: Print evidence status
        run: |
          python - <<'PY'
          import json
          r=json.load(open('forward_evidence_quality_report.json'))
          print('Forward evidence status:',r['status'])
          print('Observed snapshot dates:',r.get('observed_snapshot_dates',0))
          for policy,assets in r.get('policies',{}).items():
              for ticker,entry in assets.items():
                  print(policy,ticker,'signals:',entry['signals'],'minimum evidence met:',entry['minimum_evidence_met'])
          PY
      - name: Check archive coverage and cross-report consistency
        run: python run_forward_archive_health.py forward_batch_audit_report.json forward_evidence_quality_report.json > forward_archive_health_report.json
      - name: Print coverage health
        run: |
          python - <<'PY'
          import json
          r=json.load(open('forward_archive_health_report.json'))
          print('Archive health:',r['status'])
          print('Issues:',', '.join(r['issues']) if r['issues'] else 'none')
          PY
      - name: Build offline forward evidence dashboard
        run: python forward_evidence_dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-et-forward-batch-audit
          path: |
            forward_batch_audit_report.json
            forward_evidence_quality_report.json
            forward_evidence_dashboard.html
            forward_archive_health_report.json
          retention-days: 90
