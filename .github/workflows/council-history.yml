name: Project ET council history report
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 2-6'
permissions:
  contents: read
  actions: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Download archived accountability reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p archived_council
          gh run list --workflow council-accountability.yml --status success --limit 90 --json databaseId --jq '.[].databaseId' |
          while read -r run_id; do
            mkdir -p "archived_council/$run_id"
            gh run download "$run_id" --name project-et-council-accountability --dir "archived_council/$run_id" || true
          done
      - name: Build archived decision history
        run: python run_council_history.py archived_council > council_history_report.json
      - name: Build offline history dashboard
        run: python publish_council_history.py
      - name: Validate research artifact contracts
        run: python validate_report_artifacts.py council_history_report.json council_history_quality.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-et-council-history
          path: |
            council_history_report.json
            council_history_dashboard.html
            council_history_quality.json
          retention-days: 90
